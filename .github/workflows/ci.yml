name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      evidence_only:
        description: 'Check indexed artifact upload and retrieval without running application validation'
        type: boolean
        default: false
      browser_diagnostics:
        description: 'Retain native Linux WebKit pairing diagnostics without claiming complete qualification'
        type: boolean
        default: false

jobs:
  validate:
    if: ${{ !inputs.evidence_only && !inputs.browser_diagnostics }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Canonical Quality Gate (Docs, Types, Lint, Coverage, Performance, Build)
        run: |
          mkdir -p artifacts/validation
          set -o pipefail
          npm run gate:full 2>&1 | tee artifacts/validation/gate.log

      - name: Index validation evidence
        if: always()
        run: node scripts/indexVerificationEvidence.mjs --source artifacts/validation --source coverage --output artifacts/validation-index.json

      - name: Preserve validation evidence
        id: validation-evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/validation/
            artifacts/validation-index.json
            coverage/
          retention-days: 90

      - name: Download validation evidence independently
        if: ${{ always() && steps.validation-evidence.outputs.artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.validation-evidence.outputs.artifact-id }}
          path: artifacts/validation-download
          merge-multiple: true
      - name: Verify downloaded validation evidence
        if: ${{ always() && steps.validation-evidence.outputs.artifact-id != '' }}
        run: node scripts/verifyEvidenceDownload.mjs --index artifacts/validation-index.json --download artifacts/validation-download --downloaded-index artifacts/validation-index.json --receipt artifacts/validation-retrieval.json
      - name: Preserve validation retrieval verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-custody-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation-retrieval.json
          retention-days: 90

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Enable native Linux WebRTC address resolution
        run: |
          mkdir -p artifacts/browser
          sudo apt-get update
          sudo apt-get install -y avahi-daemon libnss-mdns
          sudo systemctl start avahi-daemon
          systemctl status avahi-daemon --no-pager | tee artifacts/browser/mdns-service.log
          dpkg-query -W avahi-daemon libnss-mdns | tee -a artifacts/browser/mdns-service.log

      - name: Build Next.js
        id: production-build
        run: npm run build

      - name: Seal the production build used by every engine
        id: production-seal
        run: node scripts/checkProductionBuild.mjs --seal artifacts/browser/frozen-build.json

      - name: Run Playwright E2E & Axe WCAG 2.2 Tests
        run: |
          mkdir -p artifacts/browser
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/browser/development.json npm run test:e2e -- --workers=1 --retries=0 --reporter=list,json 2>&1 | tee artifacts/browser/development.log

      - name: Run production operation checks in Chromium, Firefox and WebKit
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/browser
          set -o pipefail
          node scripts/checkProductionBuild.mjs --verify artifacts/browser/frozen-build.json --receipt artifacts/browser/build-before-production.json
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/browser/production.json npm run test:e2e:production -- --workers=1 --retries=0 --reporter=list,json 2>&1 | tee artifacts/browser/production.log

      - name: Verify the production build remained frozen
        if: ${{ always() && steps.production-seal.outcome == 'success' }}
        run: node scripts/checkProductionBuild.mjs --verify artifacts/browser/frozen-build.json --receipt artifacts/browser/build-after-production.json

      - name: Index browser evidence
        if: always()
        run: node scripts/indexVerificationEvidence.mjs --source artifacts/browser --source playwright-report --source test-results --output artifacts/browser-index.json

      - name: Preserve browser evidence
        id: browser-evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browsers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            artifacts/browser/
            artifacts/browser-index.json
          retention-days: 90

      - name: Download browser evidence independently
        if: ${{ always() && steps.browser-evidence.outputs.artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.browser-evidence.outputs.artifact-id }}
          path: artifacts/browser-download
          merge-multiple: true
      - name: Verify downloaded browser evidence
        if: ${{ always() && steps.browser-evidence.outputs.artifact-id != '' }}
        run: node scripts/verifyEvidenceDownload.mjs --index artifacts/browser-index.json --download artifacts/browser-download --downloaded-index artifacts/browser-index.json --receipt artifacts/browser-retrieval.json
      - name: Preserve browser retrieval verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-custody-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-retrieval.json
          retention-days: 90

  browser-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_diagnostics && !inputs.evidence_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: node scripts/checkProductionBuild.mjs --seal artifacts/browser-diagnostics/frozen-build.json
      - name: Retain native resolver baseline
        run: |
          mkdir -p artifacts/browser-diagnostics
          { systemctl status avahi-daemon --no-pager || true; dpkg-query -W avahi-daemon libnss-mdns || true; cat /etc/nsswitch.conf; } > artifacts/browser-diagnostics/resolver-before.log 2>&1
      - name: Observe pairing before resolver setup
        continue-on-error: true
        run: |
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/browser-diagnostics/pairing-before.json npm run test:e2e:production -- coDrawGuestIsolation coDrawProtocolSafety --project=webkit --workers=1 --retries=0 --reporter=list,json --output=artifacts/browser-diagnostics/before 2>&1 | tee artifacts/browser-diagnostics/pairing-before.log
      - name: Enable native resolver without changing application or browser
        run: |
          sudo apt-get update
          sudo apt-get install -y avahi-daemon libnss-mdns
          sudo systemctl start avahi-daemon
          { systemctl status avahi-daemon --no-pager; dpkg-query -W avahi-daemon libnss-mdns; cat /etc/nsswitch.conf; } > artifacts/browser-diagnostics/resolver-after.log 2>&1
      - name: Observe pairing after resolver setup
        run: |
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/browser-diagnostics/pairing-after.json npm run test:e2e:production -- coDrawGuestIsolation coDrawProtocolSafety --project=webkit --workers=1 --retries=0 --reporter=list,json --output=artifacts/browser-diagnostics/after 2>&1 | tee artifacts/browser-diagnostics/pairing-after.log
      - name: Verify both diagnostic runs used the same compiled build
        if: always()
        run: node scripts/checkProductionBuild.mjs --verify artifacts/browser-diagnostics/frozen-build.json --receipt artifacts/browser-diagnostics/build-after-pairing.json
      - name: Preserve diagnosis and original failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/browser-diagnostics/
            test-results/
          retention-days: 90

  evidence-custody:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prepare real receipt transfer witness
        run: |
          mkdir -p artifacts/custody-witness
          cp docs/research/evidence/2026-10-09-validation-repeatability/verification.json artifacts/custody-witness/.last-run.json
          cp docs/research/2026-10-09-validation-repeatability.md artifacts/custody-witness/execution.md
          node scripts/indexVerificationEvidence.mjs --source artifacts/custody-witness --output artifacts/custody-witness-index.json
      - name: Preserve visible and hidden indexed evidence
        id: custody-upload
        uses: actions/upload-artifact@v4
        with:
          name: custody-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/custody-witness/
            artifacts/custody-witness-index.json
          retention-days: 90

      - name: Download custody witness into an isolated directory
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.custody-upload.outputs.artifact-id }}
          path: artifacts/custody-download
          merge-multiple: true

      - name: Compare downloaded bytes with the original upload index
        run: node scripts/verifyEvidenceDownload.mjs --index artifacts/custody-witness-index.json --download artifacts/custody-download --downloaded-index custody-witness-index.json --strip-prefix artifacts/ --receipt artifacts/custody-retrieval.json

      - name: Preserve automated retrieval verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custody-verdict-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/custody-retrieval.json
          retention-days: 90

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Run Lighthouse CI Audit
        run: npx @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse CI Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-reports
          path: lhci-reports/
          retention-days: 7
