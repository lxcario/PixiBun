name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Canonical Quality Gate (Docs, Typecheck, Lint, Tests, Production Build)
        run: npm run gate:full

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build Next.js
        run: npm run build

      - name: Run Playwright E2E & Axe WCAG 2.2 Tests
        run: npm run test:e2e

      - name: Run production operation checks in Chromium, Firefox and WebKit
        run: npm run test:e2e:production

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/production/
          retention-days: 7

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Run Lighthouse CI Audit
        run: npx @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse CI Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-reports
          path: lhci-reports/
          retention-days: 7
