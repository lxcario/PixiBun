<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — PixiBun Atelier</title>
  <meta name="theme-color" content="#140C1E">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background-color: #140C1E;
      color: #ede8f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #201431;
      border: 2px solid #8c5120;
      border-radius: 4px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 18px;
      color: #f0be7c;
      margin: 0 0 10px 0;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 13px;
      color: #d0c4df;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .badge {
      display: inline-block;
      background: #281b3d;
      border: 1px solid #3a2e4c;
      color: #dcabdf;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #f0be7c;
      color: #140d1f;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      padding: 10px 18px;
      border: 2px solid #8c5120;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 0 2px 0 #8c5120;
    }
    .btn:hover {
      background: #fff8db;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐰 ✦</div>
    <h1>You're Away from the Network</h1>
    <div class="badge">100% Offline-Capable Atelier</div>
    <p>
      PixiBun is designed to work completely offline. If you've opened the atelier before, your workspace and stored drawings in IndexedDB are ready.
    </p>
    <a href="/studio" class="btn">Open Studio Workbench</a>
  </div>
</body>
</html>
